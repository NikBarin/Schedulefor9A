                { lesson: 'История', room: '43', teacher: 'Игорь Игоревич', hw: '', img: '' },
                { lesson: 'Химия', room: '28', teacher: 'Варвара Викторовна', hw: '', img: '' },
                { lesson: 'Теория Вероятности', room: '46', teacher: 'Екатерина Сергеевна', hw: '', img: '' },
            ]
        };
        const weekDays = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
        const schoolDays = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница'];

        const list = document.getElementById('scheduleList');
        const dayButtons = document.querySelectorAll('#daySelector button');
        let currentDay = 'Понедельник';

        function safeGet(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function safeSet(key, value) {
            try { localStorage.setItem(key, value); } catch (e) {}
        }

        const themeBtn = document.getElementById('themeBtn');

        function systemTheme() {
            return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
                ? 'light' : 'dark';
        }

        function applyTheme() {
            const theme = safeGet('raspishka-theme') || systemTheme();
            document.body.setAttribute('data-theme', theme);
            themeBtn.textContent = (theme === 'dark') ? '☀️' : '🌙';
        }

        themeBtn.addEventListener('click', function () {
            const next = (document.body.getAttribute('data-theme') === 'dark') ? 'light' : 'dark';
            safeSet('raspishka-theme', next);
            applyTheme();
        });

        applyTheme();

        function parseTimeRange(str) {
            const parts = str.split('–');
            const toMin = function (t) {
                const hm = t.split(':');
                return Number(hm[0]) * 60 + Number(hm[1]);
            };
            return { start: toMin(parts[0]), end: toMin(parts[1]) };
        }

        function formatCountdown(totalSeconds) {
            if (totalSeconds <= 0) return '0 сек';
            const m = Math.floor(totalSeconds / 60);
            const s = totalSeconds % 60;
            if (m > 0) return m + ' мин ' + (s < 10 ? '0' : '') + s + ' сек';
            return s + ' сек';
        }

        function formatCountdownBig(totalSeconds) {
            if (totalSeconds <= 0) return '0 сек';
            const d = Math.floor(totalSeconds / 86400);
            const h = Math.floor((totalSeconds % 86400) / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;
            const parts = [];
            if (d > 0) parts.push(d + ' д');
            if (h > 0) parts.push(h + ' ч');
            if (m > 0) parts.push(m + ' мин');
            parts.push(s + ' сек');
            return parts.join(' ');
        }

        function getNextSchoolDay(dayName) {
            const idx = schoolDays.indexOf(dayName);
            if (idx === -1) return 'Понедельник';
            if (idx + 1 < schoolDays.length) return schoolDays[idx + 1];
            return 'Понедельник';
        }

        function getDayOffset(fromName, toName) {
            const fromIdx = weekDays.indexOf(fromName);
            const toIdx = weekDays.indexOf(toName);
            if (fromIdx === -1 || toIdx === -1) return 1;
            if (toIdx > fromIdx) return toIdx - fromIdx;
            return 7 - fromIdx + toIdx;
        }

        function areLessonsDone(dayName, nowSec) {
            if (!schoolDays.includes(dayName)) return true;
            const rows = data[dayName];
            if (!rows || rows.length === 0) return true;
            const lastEnd = parseTimeRange(times[rows.length - 1]).end * 60;
            return nowSec >= lastEnd;
        }

        function renderDayCards(day) {
            dayButtons.forEach(function (b) {
                b.classList.toggle('active', b.dataset.day === day);
            });
            list.innerHTML = '';

            data[day].forEach(function (row, i) {
                const card = document.createElement('div');
                card.className = 'lesson-card';
                card.style.animationDelay = (i * 0.05) + 's';
                card.innerHTML =
                    '<div class="lesson-time">' + times[i] + '</div>' +
                    '<div class="lesson-name">' + row.lesson + '</div>' +
                    '<div class="lesson-info">' +
                        (row.room ? '<span>Каб. ' + row.room + '</span>' : '') +
                        (row.teacher ? '<span>' + row.teacher + '</span>' : '') +
                    '</div>' +
                    (row.hw ? '<div class="lesson-hw">ДЗ: ' + row.hw + '</div>' : '') +
                    (row.img ? '<img src="' + row.img + '" class="lesson-img" alt="Иллюстрация к уроку">' : '') +
                    '<div class="lesson-countdown hidden" id="cd-' + i + '"></div>';
                list.appendChild(card);
            });
            document.querySelectorAll('.lesson-img').forEach(function (img) {
                img.onclick = function () { openModal(img.src); };
            });
        }

        function renderDay(day) {
            currentDay = day;
            renderDayCards(day);
            updateCountdowns();
        }

        function updateCountdowns() {
            const now = new Date();
            const nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
            const todayName = weekDays[now.getDay()];
            const isTodaySchoolDay = schoolDays.includes(todayName);
            const nextDay = getNextSchoolDay(todayName);

            data[currentDay].forEach(function (_, i) {
                const el = document.getElementById('cd-' + i);
                if (el) el.className = 'lesson-countdown hidden';
                const card = el ? el.closest('.lesson-card') : null;
                if (card) card.classList.remove('active-now');
            });

            if (currentDay === todayName && isTodaySchoolDay) {
                for (let i = 0; i < data[currentDay].length; i++) {
                    const range = parseTimeRange(times[i]);
                    const startSec = range.start * 60;
                    const endSec = range.end * 60;
                    const el = document.getElementById('cd-' + i);
                    if (!el) continue;
                    const card = el.closest('.lesson-card');

                    if (nowSec >= startSec && nowSec < endSec) {
                        el.className = 'lesson-countdown during';
                        el.textContent = 'До конца урока: ' + formatCountdown(endSec - nowSec);
                        if (card) card.classList.add('active-now');
                        return;
                    } else if (nowSec < startSec) {
                        el.className = 'lesson-countdown before';
                        el.textContent = 'До начала урока: ' + formatCountdown(startSec - nowSec);
                        return;
                    }
                }
                return;
            }

            if (currentDay === nextDay) {
                const todayDone = !isTodaySchoolDay || areLessonsDone(todayName, nowSec);
                if (todayDone) {
                    const offset = getDayOffset(todayName, currentDay);
                    const firstStart = parseTimeRange(times[0]).start * 60;
                    const targetSec = offset * 86400 + firstStart - nowSec;
                    const el = document.getElementById('cd-0');
                    if (el) {
                        el.className = 'lesson-countdown before';
                        el.textContent = 'До начала урока: ' + formatCountdownBig(targetSec);
                    }
                }
            }
        }

        const modal = document.getElementById('imgModal');
        const modalImg = document.getElementById('imgModalContent');
        const modalClose = document.getElementById('imgModalClose');

        function openModal(src) {
            modalImg.src = src;
            modal.style.display = 'flex';
        }

        modalClose.onclick = function () {
            modal.style.display = 'none';
            modalImg.removeAttribute('src');
        };
        modal.onclick = function (e) {
            if (e.target === modal) {
                modal.style.display = 'none';
                modalImg.removeAttribute('src');
            }
        };

        dayButtons.forEach(function (btn) {
            btn.addEventListener('click', function () {
                renderDay(btn.dataset.day);
            });
        });

        (function () {
            const now0 = new Date();
            const todayName = weekDays[now0.getDay()];
            const nowSec = now0.getHours() * 3600 + now0.getMinutes() * 60;
            if (schoolDays.includes(todayName)) {
                renderDay(areLessonsDone(todayName, nowSec) ? getNextSchoolDay(todayName) : todayName);
            } else {
                renderDay('Понедельник');
            }
        })();

        setInterval(updateCountdowns, 1000);
    </script>
</body>
</html>
